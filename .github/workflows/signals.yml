name: HALEIO Signal Engine

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write          # Needed to commit signal log back to repo

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Signal Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 signal_engine.py

      - name: Commit Signal Log
        run: |
          git config user.name "HALEIO Bot"
          git config user.email "bot@haleio.com"
          git add signal_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "signal log update $(date -u +%Y-%m-%dT%H:%M)"
          git push
